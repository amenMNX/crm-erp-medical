services:
  backend:
    build: ./backend
    container_name: django_backend
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: /app/db.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,*.ngrok-free.dev
      DJANGO_CORS_ALLOW_ALL_ORIGINS: "False"
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://freebie-starlit-icing.ngrok-free.dev
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://freebie-starlit-icing.ngrok-free.dev
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: react_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://freebie-starlit-icing.ngrok-free.dev/api}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}   # needed so vite.config.ts adds ngrok to allowedHosts
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    command: http nginx:80 --url=${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx
    networks:
      - app_network
    ports:
      - "4040:4040"

networks:
  app_network:
    driver: bridge